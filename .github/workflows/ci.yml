name: Build and dungeon checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Verify imported model assets
        run: python tools/verify-model-assets.py
      - name: Compile and test
        run: gradle --no-daemon build
      - name: Native server and restart
        run: python tools/manager-smoke.py
      - name: Native encounters with Lootr
        env:
          ZIANMANAGER_WITH_LOOTR: 'true'
        run: python tools/manager-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zianmanager-alpha-and-evidence
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/manager-smoke*-evidence/*.log
