plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.147' }
group='com.ianblk.zianmanager'
version=mod_version
base { archivesName='zianmanager' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url='https://www.cursemaven.com' } }
neoForge {
 version='21.1.252'
 accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
 runs {
  client { client() }
  server { server(); programArgument '--nogui' }
  managerSmoke { server(); gameDirectory=project.file(project.findProperty('smokeDir') ?: 'build/manager-smoke'); programArgument '--nogui' }
 }
 mods { zianmanager { sourceSet sourceSets.main } }
}
dependencies {
 if(project.hasProperty('withLootr')) implementation 'curse.maven:lootr-361276:8428025'
 testImplementation platform('org.junit:junit-bom:5.13.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testImplementation 'com.google.code.gson:gson:2.10.1'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test',Test) { useJUnitPlatform(); if(System.getProperty('os.name').toLowerCase().contains('windows')) systemProperty 'junit.jupiter.tempdir.cleanup.mode.default','NEVER'; systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('test-tmp').get().asFile.absolutePath; doFirst { layout.buildDirectory.dir('test-tmp').get().asFile.mkdirs() } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.named('processResources') { inputs.property('mod_version',mod_version); filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version:mod_version) } }
tasks.named('jar') { from('LICENSE') { into 'META-INF' } }
